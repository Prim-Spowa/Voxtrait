# Infrastructure locale — pile complète de développement et de test (ST 11.3
# « Environnement de développement et de test reproductible »).
#
# `docker compose up -d` démarre l'intégralité des dépendances externes de
# l'application : PostgreSQL 16 (ST 9.1), Redis 7 (ST 9.3/9.4) et MinIO
# (ST 9.2, compatible S3) avec création automatique du bucket `fandub-dev`.
#
# Historique : ce fichier ne couvrait initialement que Redis (ST 9.3) ;
# ST 9.2 avait introduit son propre service `minio` sur une branche séparée.
# ST 11.3 fusionne le tout ici pour éviter la dérive « un fichier compose par
# story ».
#
# ⚠️ FFmpeg/ffprobe restent un prérequis binaire *hors* Docker : l'application
# (`npm run dev`) et le worker (`npm run worker`) tournent sur la machine
# hôte, pas dans un conteneur. Cf. README, section « Prérequis ».
services:
  postgres:
    image: postgres:16
    # Identifiants alignés sur le `DATABASE_URL` par défaut de `.env.example`.
    environment:
      POSTGRES_USER: fandub
      POSTGRES_PASSWORD: fandub
      POSTGRES_DB: fandub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fandub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web (minioadmin / minioadmin)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Service éphémère : crée le bucket `fandub-dev` au démarrage puis s'arrête.
  # Idempotent (`mb --ignore-existing`), rejoué sans risque à chaque
  # `docker compose up`.
  minio-init:
    image: minio/mc:RELEASE.2024-08-29T01-40-52Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/fandub-dev &&
      echo 'Bucket fandub-dev prêt.'
      "

volumes:
  postgres-data:
  minio-data:
