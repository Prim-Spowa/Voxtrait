# Stockage objet local pour le développement — ST 9.2 « Stockage objet réel
# pour les fichiers vidéo/audio » (cf. `stories-techniques-site-doublage.md`).
#
# Fournit un MinIO (compatible S3) en local, condition posée par la story
# technique (« Fournir une configuration MinIO en local (docker-compose) pour
# ne pas dépendre d'un compte cloud en développement »). Les identifiants et
# le bucket créés ici correspondent au repli par défaut de
# `getObjectStorageConfig` (`src/lib/objectStorage.ts`) : `next dev` fonctionne
# donc sans variable d'environnement supplémentaire dès que ce service tourne.
#
# Démarrage : `docker compose up -d minio`
# Console web (identifiants ci-dessous) : http://localhost:9001

services:
  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée le bucket de développement (`fandub-dev`) puis s'arrête — évite de
  # créer le bucket manuellement à chaque `docker compose down -v`.
  minio-init:
    image: minio/mc:RELEASE.2024-08-29T09-59-55Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/fandub-dev
      "

volumes:
  minio-data:
