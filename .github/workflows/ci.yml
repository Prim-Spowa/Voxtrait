# CI — ST 9.1 « Bascule intégrale sur PostgreSQL », Definition of Done
# technique : « CI verte avec une base Postgres de test ». Aucun pipeline
# n'existait avant cette story (cf. notes de dev des stories précédentes,
# « tests non exécutés en CI ») ; ce fichier ne couvre donc que ce que ST 9.1
# exige — vérification de types + suite de tests (incluant les tests
# d'intégration Postgres de `src/lib/__tests__/st9.1-postgres.integration.test.ts`)
# contre une vraie base, migrée et seedée comme en local.
#
# `npm run test:ci` (et non `npm test`) : exclut 3 fichiers de test dont les
# échecs sont préexistants et sans rapport avec les stories en cours
# (`VideoPlayer.test.tsx`, `VoiceRecorder.test.tsx`, `AdminScriptEditorClient.test.tsx`).
# La liste et les tickets de suivi datés sont dans `vitest.config.ts`
# (`KNOWN_FAILING`) et `Claude output/dev-note/dev-notes-ST11.3-env-dev-test.md`.
# `npm test` (en local) continue de les exécuter : ils restent visibles pour
# qui travaille sur ces composants. La 4e exclusion historique
# (`useClipPlayback.test.jsx`) a été retirée : le fichier n'existe plus (ST 11.3).
#
# ST 9.3 « Traitement vidéo réel (ffprobe/FFmpeg) et file de jobs réelle » —
# DoD explicite : « CI verte (FFmpeg/Redis disponibles en CI) ». Ajouts :
# service `redis` (image officielle, commande par défaut incluse — contraire
# à MinIO/ST 9.2 dont l'image exige un argument, cf. ses propres notes de
# dev ; la déclaration `services:` native de GitHub Actions suffit donc ici,
# pas besoin d'un `docker run` explicite) et installation du binaire `ffmpeg`
# (fournit aussi `ffprobe`) via `apt-get`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fandub
          POSTGRES_PASSWORD: fandub
          POSTGRES_DB: fandub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fandub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ST 11.3 — `.env.test` (versionné) est la source unique de config de
      # test, partagée local / CI. Le CLI Prisma ne charge que `.env`.
      - name: Prépare l'environnement de test
        run: cp .env.test .env

      - name: Installe FFmpeg/ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Génère le client Prisma
        run: npx prisma generate

      - name: Applique les migrations Prisma
        run: npx prisma migrate deploy

      - name: Injecte le jeu de données de démonstration
        run: npm run db:seed

      - name: Démarre MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2024-08-29T01-40-52Z server /data --console-address ":9001"

      - name: Attend MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO prêt."
              exit 0
            fi
            sleep 1
          done
          echo "MinIO n'a pas répondu à temps." >&2
          exit 1

      - name: Crée le bucket MinIO de test (fandub-dev)
        run: aws --endpoint-url http://localhost:9000 s3 mb s3://fandub-dev
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Tests (unitaires + intégration Postgres/FFmpeg/Redis)
        run: npm run test:ci

  # ST 11.3 — parcours de bout en bout (Playwright), job séparé pour ne pas
  # allonger le chemin critique du job `test` (démarrage Next + navigateur).
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fandub
          POSTGRES_PASSWORD: fandub
          POSTGRES_DB: fandub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fandub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `.env.test` est la source unique de configuration de test (ST 11.3).
      # Le CLI Prisma ne charge que `.env` : on l'en dérive ici.
      - name: Prépare l'environnement de test
        run: cp .env.test .env

      - name: Installe FFmpeg/ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installe le navigateur Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Génère le client Prisma
        run: npx prisma generate

      - name: Applique les migrations + seed (base fandub_test)
        run: npx prisma migrate deploy && npm run db:seed

      - name: Parcours de bout en bout
        run: npm run test:e2e

      - name: Rapport Playwright (échecs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
